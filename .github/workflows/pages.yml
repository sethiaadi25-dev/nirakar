# Publishes the site to GitHub Pages on every push to main.
# A custom workflow (instead of the default one) so large media gets a longer deploy timeout.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp each deploy's CSS/JS links with the commit id so browsers never show a stale version
      - name: Cache-bust asset links
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html project.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
